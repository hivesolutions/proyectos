name: DockerX Workflow
on:
  push:
    tags:
      - "*"
    branches-ignore:
      - none
  workflow_dispatch:

concurrency:
  group: dockerx-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push Docker Image
    timeout-minutes: 60
    runs-on: [self-hosted, ubuntu, latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build variables
        id: set_vars
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            tag="latest"
          else
            ref_name=${{ github.ref_name }}
            tag=${ref_name//\//_}
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: hivesolutions/proyectos:${{ steps.set_vars.outputs.tag }}

  trigger-deploy-proyectos:
    name: Trigger proyectos deployment
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: [self-hosted, ubuntu, latest]

    steps:
      - name: Trigger deployment
        uses: hivesolutions/deploy-action@v1
        with:
          repository: hivesolutions/infra-bemisc
          service: proyectos
          group: apps
          token: ${{ secrets.INFRA_DEPLOY_PAT }}
